name: Build

# 推送到 main/master 时自动构建 macOS + Windows 安装包，并作为 artifact 上传。
# 推送 v* 标签（如 v0.1.0）时额外创建 GitHub Release，把安装包作为发布附件。
# 需手动触发可点 Actions → Build → Run workflow。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 提交即验证：core 测试 + clippy + 前端类型检查。不产出安装包，失败即拦住。
  # 只跑 macOS 是因为 gateshift-core 的 platform/macos.rs 用 cfg(target_os = "macos")
  # 编译，Linux runner 上根本不会编译到它，测了等于没测。
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gateshift-core -> target
            src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      # 顺带产出 dist/：src-tauri 的 build.rs 在编译期会检查 tauri.conf.json 指向的
      # 前端产物是否存在，没有 dist 会直接报错，所以这里用 build 而不是单跑 tsc。
      - name: Frontend build (type check + bundle)
        run: npm run build

      - name: Core tests
        working-directory: gateshift-core
        run: cargo test --features testkit --all-targets

      - name: App command tests
        working-directory: src-tauri
        run: cargo test --features testkit --all-targets

      - name: Clippy (core)
        working-directory: gateshift-core
        run: cargo clippy --features testkit --all-targets -- -D warnings

      - name: Clippy (app)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：打出 universal 二进制，同一份 .dmg 在 Apple Silicon 和 Intel 上都能跑
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Windows x64
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          # Windows x86（32 位）：老机器 / 32 位系统仍需要
          - os: windows-latest
            platform: windows
            target: i686-pc-windows-msvc
            rust_targets: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个 mac target 都装上，交叉 target 由 matrix 指定
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend deps
        run: npm ci

      # 统一一条构建步骤，目标由 matrix 决定。
      # 带 --target 后产物落在 target/<triple>/release/bundle/，不再是 target/release/bundle/。
      - name: Build Tauri app
        env:
          # 如需签名 + 公证，取消注释并在仓库 Settings → Secrets 配置：
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateshift-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  # 仅在推送 v* 标签时执行：汇总各平台产物（mac universal / win x64 / win x86），创建 GitHub Release 并上传为附件。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 必须要写权限（覆盖顶层的 contents: read）
    steps:
      # 保留目录结构（dist/gateshift-macos/...、dist/gateshift-windows/...），用通配符挑文件
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # .app 是目录，Release 附件只能是单文件，压成 zip（产物在子目录里，不能粗暴删目录）
      - name: Pack .app
        run: |
          find dist -type d -name "*.app" -exec zip -qry {}.zip {} \;
          find dist -type f | sort

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.zip
          generate_release_notes: true # 按提交记录自动生成发行说明
