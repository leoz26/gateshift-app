[package]
name = "gateshift-app"
version = "0.1.0"
description = "GateShift — 默认网关 / 系统 DNS 切换（Tauri + React 壳）"
authors = ["GateShift"]
edition = "2021"

# Tauri v2 标准结构：库 + 极薄 `main.rs`。移动端也走这套。
[lib]
name = "gateshift_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 开机自启：macOS 写 LaunchAgent plist，Windows 写注册表 Run 键，一个插件跨平台。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 核心库以相对路径 vendoring 进本仓库（保持「core 只管逻辑、Tauri 只管壳」分层），
# 这样仓库自包含，GitHub Actions 或任何机器 clone 后都能直接构建，无需本机绝对路径。
# 若你更希望 core 作为独立仓库维护，可改成 git 依赖或 git submodule。
gateshift-core = { path = "../gateshift-core" }

[features]
# 应用自身的命令层集成测试用：开启后可在测试里用 testkit 的 MockPlatform
# 断言「IPC 命令到底触发了哪些网络操作」，无需真实网络或系统授权。
testkit = ["gateshift-core/testkit"]
